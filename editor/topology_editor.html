<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NMTs 拓扑编辑器</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@xyflow/react@12/dist/umd/index.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@xyflow/react@12/dist/style.css" />
<style>
  :root { --bg:#1e1e2e; --panel:#2a2a3a; --accent:#238636; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:#e6e6e6; height:100vh; overflow:hidden; }
  #app { display:flex; height:100vh; }
  .sidebar { width:220px; background:var(--panel); padding:12px; overflow-y:auto; border-right:1px solid #3a3a4a; }
  .sidebar h3 { font-size:13px; margin:8px 0; color:#9da5b4; }
  .dev-btn { display:block; width:100%; margin:6px 0; padding:8px; background:#333; border:1px solid #444; border-radius:6px; color:#e6e6e6; cursor:pointer; text-align:left; font-size:13px; }
  .dev-btn:hover { background:var(--accent); border-color:var(--accent); }
  #canvas { flex:1; }
  .props { width:260px; background:var(--panel); padding:12px; border-left:1px solid #3a3a4a; overflow-y:auto; }
  .props label { display:block; font-size:12px; margin:8px 0 2px; color:#9da5b4; }
  .props input, .props select { width:100%; padding:6px; background:#1e1e2e; border:1px solid #444; border-radius:4px; color:#e6e6e6; font-size:13px; }
  .toolbar { position:absolute; top:8px; left:232px; z-index:10; display:flex; gap:8px; }
  .toolbar button { padding:6px 12px; background:var(--accent); border:none; border-radius:5px; color:#fff; cursor:pointer; font-size:13px; }
  .toolbar button.secondary { background:#444; }
  .node-card { padding:8px 12px; border-radius:8px; border:2px solid #555; background:#2b2b3a; min-width:120px; text-align:center; }
  .node-card .role { font-size:10px; color:#9da5b4; }
  .node-card .name { font-size:13px; font-weight:600; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const { useState, useCallback, useMemo, useEffect } = React;
const { ReactFlow, Background, Controls, MiniMap, addEdge, useNodesState, useEdgesState, Handle, Position } = ReactFlow;

const VENDORS = { huawei_vrp:'华为', h3c_vrp:'H3C', cisco_ios:'Cisco' };
const ROLES = { core:'核心', dist:'汇聚', access:'接入', router:'路由器', firewall:'防火墙' };
const ICONS = { core:'🔷', dist:'🔶', access:'🟩', router:'🌐', firewall:'🛡️' };

function DeviceNode({ data, selected }) {
  return React.createElement('div', {
    className: 'node-card',
    style: { borderColor: selected ? '#238636' : '#555' }
  }, [
    React.createElement(Handle, { key:'t', type:'target', position: Position.Left }),
    React.createElement('div', { key:'i', className:'role' }, (ICONS[data.role]||'') + ' ' + (ROLES[data.role]||data.role)),
    React.createElement('div', { key:'n', className:'name' }, data.name || data.id),
    React.createElement('div', { key:'h', className:'role' }, data.config?.hostname || ''),
    React.createElement(Handle, { key:'s', type:'source', position: Position.Right }),
  ]);
}

const nodeTypes = { device: DeviceNode };

function App() {
  const [nodes, setNodes, onNodesChange] = useNodesState([]);
  const [edges, setEdges, onEdgesChange] = useEdgesState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [model, setModel] = useState({ devices:[], links:[] });

  const onConnect = useCallback((c) => setEdges((eds) => addEdge({ ...c, label:'链路' }, eds)), [setEdges]);

  const addDevice = (role) => {
    const id = 'd' + Date.now();
    const node = {
      id, type:'device', position:{ x:80+Math.random()*300, y:80+Math.random()*300 },
      data: { id, name:'新设备', role, config:{ hostname:'', vlans:[], trunk_vlans:[], access_vlan:null, l3_intfs:[], routing:'None', stp_enabled:true } }
    };
    setNodes((nds) => nds.concat(node));
    setSelectedId(id);
  };

  const updateSelected = (patch) => {
    setNodes((nds) => nds.map((n) => n.id === selectedId
      ? { ...n, data: { ...n.data, ...patch } } : n));
  };

  const selected = nodes.find((n) => n.id === selectedId);

  // 导出为 NMTs Topology JSON（通过 pywebview bridge 或复制）
  const buildModel = () => {
    const devices = nodes.map((n) => ({
      id: n.id, name: n.data.name || n.id, vendor: n.data.vendor || 'huawei_vrp',
      role: n.data.role || 'access', mgmt_ip: n.data.mgmt_ip || '', creds: null,
      config: n.data.config || { hostname:'' }
    }));
    const links = edges.map((e) => ({ from: e.source, to: e.target, from_port:'', to_port:'' }));
    return { devices, links };
  };

  const save = async () => {
    const m = buildModel();
    const json = JSON.stringify(m, null, 2);
    if (window.pywebview && window.pywebview.api) {
      await window.pywebview.api.save(json);
      alert('已保存 topology.json');
    } else {
      const blob = new Blob([json], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'topology.json'; a.click();
    }
  };

  const load = async () => {
    let json = null;
    if (window.pywebview && window.pywebview.api) {
      json = await window.pywebview.api.load();
    } else {
      const input = document.createElement('input'); input.type='file'; input.accept='.json';
      input.onchange = () => { const f=input.files[0]; const r=new FileReader(); r.onload=()=>applyModel(JSON.parse(r.result)); r.readAsText(f); };
      input.click(); return;
    }
    if (json) applyModel(JSON.parse(json));
  };

  const applyModel = (m) => {
    const ns = (m.devices||[]).map((d) => ({
      id:d.id, type:'device', position:{ x:80+Math.random()*300, y:80+Math.random()*300 },
      data:{ id:d.id, name:d.name, vendor:d.vendor, role:d.role, mgmt_ip:d.mgmt_ip, config:d.config }
    }));
    const es = (m.links||[]).map((l, i) => ({ id:'e'+i, source:l.from, target:l.to, label:'链路' }));
    setNodes(ns); setEdges(es);
  };

  useEffect(() => { load(); }, []);

  return React.createElement('div', { id:'app' },
    React.createElement('div', { className:'sidebar' },
      React.createElement('h3', null, '设备类型'),
      ['core','dist','access','router','firewall'].map((r) =>
        React.createElement('button', { key:r, className:'dev-btn', onClick:()=>addDevice(r) },
          (ICONS[r]||'') + ' ' + (ROLES[r]||r) ))
    ),
    React.createElement('div', { className:'toolbar' },
      React.createElement('button', { onClick: save }, '保存'),
      React.createElement('button', { className:'secondary', onClick: load }, '打开'),
      React.createElement('button', { className:'secondary', onClick:()=>alert('导出 PNG 请用浏览器截图 / 后续集成') }, '导出 PNG')
    ),
    React.createElement('div', { id:'canvas' },
      React.createElement(ReactFlow, {
        nodes, edges, onNodesChange, onEdgesChange, onConnect, nodeTypes,
        onNodeClick:(_, n)=>setSelectedId(n.id), fitView:true
      },
        React.createElement(Background, null),
        React.createElement(Controls, null),
        React.createElement(MiniMap, null)
      )
    ),
    React.createElement('div', { className:'props' },
      React.createElement('h3', null, '设备属性'),
      selected ? React.createElement('div', null,
        React.createElement('label', null, '名称'),
        React.createElement('input', { value: selected.data.name||'', onChange:(e)=>updateSelected({ name:e.target.value }) }),
        React.createElement('label', null, '主机名 hostname'),
        React.createElement('input', { value: selected.data.config?.hostname||'', onChange:(e)=>updateSelected({ config:{ ...selected.data.config, hostname:e.target.value } }) }),
        React.createElement('label', null, '厂商'),
        React.createElement('select', { value: selected.data.vendor||'huawei_vrp', onChange:(e)=>updateSelected({ vendor:e.target.value }) },
          Object.entries(VENDORS).map(([k,v])=>React.createElement('option',{ key:k, value:k }, v))),
        React.createElement('label', null, '角色'),
        React.createElement('select', { value: selected.data.role||'access', onChange:(e)=>updateSelected({ role:e.target.value }) },
          Object.entries(ROLES).map(([k,v])=>React.createElement('option',{ key:k, value:k }, v)))
      ) : React.createElement('p', { style:{color:'#9da5b4',fontSize:'12px'} }, '点击节点编辑属性')
    )
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
</html>
