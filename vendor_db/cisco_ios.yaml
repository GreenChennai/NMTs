# Cisco IOS 命令模板（模块三 / 模块四共用）
vendor: cisco_ios
label: "Cisco (IOS)"
prompt_features: [">", "#", ")"]
enter_config: "configure terminal"
exit_config: "end"
show_run: "show running-config"
save_config: "copy running-config startup-config"

categories:
  - id: system
    label: "系统管理"
  - id: interface
    label: "接口配置"
  - id: vlan
    label: "VLAN 配置"
  - id: routing
    label: "路由配置"
  - id: acl
    label: "ACL 访问控制"
  - id: diagnose
    label: "诊断排查"

commands:
  - id: enter_config
    category: system
    label: "进入全局配置"
    command: "configure terminal"
  - id: exit_config
    category: system
    label: "返回特权模式"
    command: "end"
  - id: set_hostname
    category: system
    label: "设置主机名"
    command: "hostname {name}"
    args:
      - { name: "name", label: "主机名", type: "string" }
  - id: show_run
    category: system
    label: "查看当前配置"
    command: "show running-config"
  - id: save_config
    category: system
    label: "保存配置"
    command: "copy running-config startup-config"
    interactive: true
    confirm: "\r"
  - id: reload
    category: system
    label: "重启设备"
    command: "reload"
    interactive: true
    confirm: "y"
  - id: show_clock
    category: system
    label: "查看时间"
    command: "show clock"
  - id: ntp_server
    category: system
    label: "NTP 同步"
    command: "ntp server {ip}"
    args:
      - { name: "ip", label: "NTP 服务器", type: "ip" }

  - id: enter_if
    category: interface
    label: "进入接口"
    command: "interface {if}"
    args:
      - { name: "if", label: "接口名", type: "string", placeholder: "GigabitEthernet0/1" }
  - id: set_ip
    category: interface
    label: "配置 IP 地址"
    command: "ip address {ip} {mask}"
    args:
      - { name: "ip", label: "IP 地址", type: "ip" }
      - { name: "mask", label: "掩码", type: "mask" }
  - id: no_shutdown
    category: interface
    label: "启用接口"
    command: "no shutdown"
  - id: shutdown
    category: interface
    label: "关闭接口"
    command: "shutdown"
  - id: set_desc
    category: interface
    label: "接口描述"
    command: "description {text}"
    args:
      - { name: "text", label: "描述", type: "string" }
  - id: show_if_brief
    category: interface
    label: "查看接口状态"
    command: "show ip interface brief"

  - id: create_vlan
    category: vlan
    label: "创建 VLAN"
    command: "vlan {vlan}"
    args:
      - { name: "vlan", label: "VLAN ID", type: "int" }
  - id: port_access
    category: vlan
    label: "Access 端口"
    command: "switchport access vlan {vlan}"
    args:
      - { name: "vlan", label: "VLAN ID", type: "int" }
  - id: port_trunk
    category: vlan
    label: "Trunk 放行 VLAN"
    command: "switchport trunk allowed vlan {vlan}"
    args:
      - { name: "vlan", label: "VLAN ID", type: "string" }
  - id: show_vlan
    category: vlan
    label: "查看 VLAN"
    command: "show vlan"

  - id: static_route
    category: routing
    label: "静态路由"
    command: "ip route {dest} {mask} {nh}"
    args:
      - { name: "dest", label: "目的网段", type: "ip" }
      - { name: "mask", label: "掩码", type: "mask" }
      - { name: "nh", label: "下一跳", type: "ip" }
  - id: default_route
    category: routing
    label: "默认路由"
    command: "ip route 0.0.0.0 0.0.0.0 {nh}"
    args:
      - { name: "nh", label: "下一跳", type: "ip" }
  - id: show_route
    category: routing
    label: "查看路由表"
    command: "show ip route"

  - id: acl_standard
    category: acl
    label: "标准 ACL"
    command: "access-list {id} permit {ip} {mask}"
    args:
      - { name: "id", label: "ACL 编号 (1-99)", type: "int" }
      - { name: "ip", label: "源 IP", type: "ip" }
      - { name: "mask", label: "通配符掩码", type: "string" }
  - id: acl_extended
    category: acl
    label: "扩展 ACL"
    command: "access-list {id} permit ip any any"
    args:
      - { name: "id", label: "ACL 编号 (100-199)", type: "int" }
  - id: acl_apply
    category: acl
    label: "接口应用 ACL"
    command: "ip access-group {id} in"
    args:
      - { name: "id", label: "ACL 编号", type: "int" }

  - id: ping
    category: diagnose
    label: "Ping"
    command: "ping {ip}"
    args:
      - { name: "ip", label: "目标 IP", type: "ip" }
  - id: tracert
    category: diagnose
    label: "Traceroute"
    command: "traceroute {ip}"
    args:
      - { name: "ip", label: "目标 IP", type: "ip" }
  - id: show_arp
    category: diagnose
    label: "查看 ARP 表"
    command: "show arp"
  - id: show_mac
    category: diagnose
    label: "查看 MAC 表"
    command: "show mac address-table"
  - id: show_log
    category: diagnose
    label: "查看日志"
    command: "show logging"
  - id: show_cpu
    category: diagnose
    label: "查看 CPU 利用率"
    command: "show processes cpu"
