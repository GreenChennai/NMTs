name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable, msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build (release)
        run: cargo build --release --locked

      - name: Stage portable bundle
        shell: pwsh
        run: |
          $dist = "dist/NMTs-portable"
          New-Item -ItemType Directory -Force -Path $dist, "$dist/config", "$dist/vendor_db" | Out-Null
          Copy-Item target/release/nmts.exe $dist/
          Copy-Item config/default.yaml $dist/config/
          Copy-Item vendor_db/*.yaml $dist/vendor_db/
          Copy-Item README.md, LICENSE, RELEASE_NOTES.md $dist/

      - name: Package zip (portable)
        shell: pwsh
        run: Compress-Archive -Path dist/NMTs-portable/* -DestinationPath dist/NMTs-windows-portable.zip

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer (NSIS)
        shell: pwsh
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi'

      - name: Collect artifacts (flat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/artifacts | Out-Null
          Copy-Item target/release/nmts.exe dist/artifacts/
          Copy-Item dist/NMTs-windows-portable.zip dist/artifacts/
          Copy-Item NMTs-setup.exe dist/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nmts-windows-x86_64
          path: dist/artifacts/
          if-no-files-found: error

  release:
    name: GitHub Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nmts-windows-x86_64
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nmts.exe
            dist/NMTs-windows-portable.zip
            dist/NMTs-setup.exe
          prerelease: true
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
